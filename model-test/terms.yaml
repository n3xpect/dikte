    accept: []
    fix: [mörç, mörc, mörj]
  - term: pull request
    accept: [PR, pull-request, pullrequest]
    fix: [pul rikuest, pul request, pull rikuest, pul rikvest, pulrikuest]
  - term: deploy
    accept: []
    fix: [diploy, diploi, dipiloy]
  - term: Go
    accept: [golang]          # "go" Türkçe değil; ama "go" için fix YOK
    fix: [goleng]
  - term: session
    accept: []
    fix: [seşın, seşin, seşen]
  - term: web app
    accept: [webapp, web-app]
    fix: [veb app, veb ap, web ap, vebap, veb epp]
