# Terim kütüphanesi — Türkçe dikte içinde geçen İngilizce yazılım terimleri.
#
# Alanlar:
#   term:   Doğru (kanonik) yazım. Çıktıda görmek istediğin hâli; büyük/küçük harf korunur.
#   accept: Skorlamada "doğru" sayılan diğer yazımlar (büyük/küçük harf duyarsız).
#           Kanonik yazım zaten otomatik olarak kabul edilir, tekrar yazmana gerek yok.
#   fix:    Modelin ürettiği yanlış yazımlar; çıktıda otomatik olarak `term` ile değiştirilir.
#           Tam kelime eşleşmesi, büyük/küçük harf duyarsız. Kesme işaretiyle eklenen ek
#           korunur: "brenç'i" -> "branch'i". Bitişik ek ("brençi") BİLEREK düzeltilmez,
#           çünkü "komit" + "e" = "komite" gibi gerçek Türkçe kelimeleri bozabilir.
#           Birden fazla kelime olabilir ("veb app"). Uzun eşleşme önce uygulanır.
#
# Kurallar:
#   - `fix` listesine ASLA gerçek bir Türkçe kelime koyma (ör. "keş", "imaj", "konteyner",
#     "pars", "branş", "indeks" — bunlar normal metni bozar).
#   - Whisper istemine (prompt) listedeki ilk terimler girer; önemli terimleri üste koy.
#   - Kısa (≤3 harf) terimlerde skorlama yalnızca kesmeli eki tanır ("bug'ı", "log'lar"),
#     çünkü "bug" + "ün" = "bugün", "git" + "mek" = "gitmek".
#
# "soket" kararı: Türkçede "soket" (elektrik soketi) yazımı var ama bu uygulama yazılım
# diktesi için; çıktıda İngilizce "socket" istiyoruz. Bu yüzden "soket" `fix` içinde
# (otomatik "socket" olur) ve `accept` içinde DEĞİL (ham çıktıda "soket" hata sayılır).

terms:
  - term: git
    accept: []
    fix: []
  - term: branch
    accept: []
    fix: [brenç, brenc, brençh]
  - term: commit
    accept: []
    fix: [komit, kommit, komitt]
