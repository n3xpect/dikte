  - {lang: en, text: "Sounds good."}
  - {lang: en, text: "Merge it."}
  - {lang: en, text: "Ship it."}
  - {lang: en, text: "Thank you."}
  - {lang: en, text: "Not yet."}
  - {lang: en, text: "Run the tests."}
  - {lang: en, text: "Deploy to staging."}
