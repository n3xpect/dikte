name: dikte
options:
  bundleIdPrefix: com.mehmetcaykara
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.3.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  dikte:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Info.plist
      properties:
        CFBundleName: Dikte
        CFBundleDisplayName: Dikte
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "2"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: "Dikte, konuşmanı yazıya çevirmek için mikrofonu kullanır. Ses bu Mac'ten dışarı çıkmaz."
        NSHumanReadableCopyright: ""
        DikteDevEngineDir: $(DIKTE_DEV_ENGINE_DIR)
    entitlements:
      path: dikte.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehmetcaykara.dikte
        PRODUCT_NAME: dikte
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # Dev builds start the engine from the repo; release builds use the bundled copy.
        DIKTE_DEV_ENGINE_DIR: $(SRCROOT)/../engine
